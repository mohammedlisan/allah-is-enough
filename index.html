<!DOCTYPE html>
<html>
<head>
    <title>ALLAH IS ENOUGH</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: url("muslims_prayer.jpg"); 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            background-color: rgba(0,0,0,0.5);
            background-blend-mode: darken;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 300px;
            animation: fadeIn 1.5s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            opacity: 0.9;
        }

        /* Button */
        .btn {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #333;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.1);
            background: #f2f2f2;
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Floating animation */
        .card:hover {
            transform: translateY(-10px);
            transition: 0.3s;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>ASALAMUALIKUM👋</h1>
        <h2>Sura Ad-Duha [93:4]</h2>
        <video width="250" controls>
        <source src="suravideo.mp4" type="video/mp4">
       
    </video>

        <p><b>CREATED: ALLAH 🛐</b></p>
        <p><b>CONTACT:PRAY 5 TIMES 📿</b></p>

        <button class="btn" onclick="showMessage()">Click Me</button>
    </div>

    <script>
        function showMessage() {
            alert(" IF YOU LIKE IT GIVE ME  A COMPLEMENT 😄");
        }
    </script>

</body>
</html>
